# LiteLLM Proxy Configuration
# Reference: https://docs.litellm.ai/docs/proxy/configs
#
# Model naming convention:
#   model_name   — the alias clients use in API requests (e.g. "qwen3-32b")
#   litellm_params.model — the upstream identifier LiteLLM routes to
#
# dev profile routes below use Ollama running on the host.
# prod profile routes are commented out; uncomment and adjust for vLLM.
#
# Phase B will add: virtual_keys, budget_manager, callbacks (audit log).
# Do not add those here.

model_list:

  # ── dev routes — Ollama on host ──────────────────────────────
  # On Linux, Ollama binds to 127.0.0.1 by default, which is unreachable from
  # containers. Two options:
  #   (A) Preferred: set OLLAMA_HOST=0.0.0.0 via systemd override and use port 11434.
  #   (B) Temporary: run scripts/ollama-proxy.py in background (port 11435 → 11434).
  # See README.md "One-time host setup" for instructions on option A.
  # Use openai/ provider pointing at Ollama's OpenAI-compatible endpoint (/v1).
  # This avoids LiteLLM's native Ollama provider stripping content from models
  # that return a "thinking" field (e.g. Qwen3). The model name must match the
  # Ollama tag exactly (verified with: ollama list).
  - model_name: qwen3-32b
    litellm_params:
      model: openai/qwen3:32b
      # Port 11435 = ollama-proxy.py forwarding to Ollama on 127.0.0.1:11434.
      # Change back to 11434 after applying the OLLAMA_HOST=0.0.0.0 systemd override.
      api_base: http://host.docker.internal:11434/v1
      api_key: "none"

  - model_name: gemma4-31b
    litellm_params:
      model: openai/gemma4:31b
      api_base: http://host.docker.internal:11434/v1
      api_key: "none"

  # ── prod routes — vLLM container (uncomment for prod profile) ─
  # - model_name: vllm-default
  #   litellm_params:
  #     model: openai/your-model-id    # matches the --model arg passed to vLLM
  #     api_base: http://vllm:8000/v1
  #     api_key: "none"                # vLLM does not require a key by default

general_settings:
  # Master key is injected from the environment; never hardcode here.
  master_key: "os.environ/LITELLM_MASTER_KEY"

  # Phase B: file-based virtual key auth.
  # Replaces LiteLLM's database-backed /key/generate (which requires PostgreSQL).
  # See DECISIONS.md ADR-0004 for the rationale.
  # Module path is resolved relative to this config file's directory (/app/).
  custom_auth: "callbacks.key_auth.user_api_key_auth"

  # Drop requests to undefined models rather than passing them through silently.
  drop_params: false

litellm_settings:
  # Phase B: SQLite audit callback.
  # Logs every request (user, model, tokens, latency) to data/audit.db.
  # Prompt/response content is omitted by default (AUDIT_LOG_CONTENT=false).
  callbacks: ["callbacks.audit_logger.sqlite_audit_logger"]

  # LiteLLM's own key-info redaction; our callback manages its own redaction policy.
  redact_user_api_key_info: true
